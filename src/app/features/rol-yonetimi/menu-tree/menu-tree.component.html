<ul class="menu-tree">
  <li *ngFor="let node of nodes">
    <div class="node-row">
      <!-- Expand/Collapse toggle (sadece children varsa) -->
      <div class="toggle-area" *ngIf="hasChildren(node)" (click)="toggle(node)">
        <i class="ri-arrow-down-s-line" *ngIf="isExpanded(node)"></i>
        <i class="ri-arrow-right-s-line" *ngIf="!isExpanded(node)"></i>
      </div>
      <div class="toggle-spacer" *ngIf="!hasChildren(node)"></div>

      <!-- Checkbox (tri-state) -->
      <input type="checkbox"
             #permissionCheckbox
             class="form-check-input"
             [checked]="node.yetkiTipiId === yetkiTipi.W"
             [indeterminate]="node.yetkiTipiId === yetkiTipi.R"
             [disabled]="isPermissionDisabled(node)"
             (change)="onPermissionChange(node, permissionCheckbox)">

      <!-- İkon -->
      <i *ngIf="node.icon" class="{{ node.icon }} node-icon"></i>

      <!-- Label -->
      <span class="node-label">{{ node.ad || (node.labelKey | translate) }}</span>
      <small *ngIf="node.kritikMi" class="text-danger">{{ 'PERMISSIONS.CRITICAL' | translate }}</small>
    </div>

    <!-- Recursive children -->
    <app-menu-tree *ngIf="hasChildren(node) && isExpanded(node)"
                   [nodes]="node.children" [disabled]="disabled">
    </app-menu-tree>
  </li>
</ul>
